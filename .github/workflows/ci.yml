# ADR 0006 : CI bloquante dès le premier commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
