# ADR 0006 : CI bloquante dès le premier commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Le site se construit, et son JavaScript initial reste sous la limite.
      - run: pnpm build

      - run: pnpm size

  database:
    name: schéma · RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version figée : `latest` a cassé la CI à la sortie de la v3, sans aucun
      # changement dans le dépôt. Monter de version se fait par une PR.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      # Postgres et son API (le site la lit), sans les autres services.
      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Droits d'accès (pgTAP), écriture, puis lecture par le site, sur la démonstration.
      - run: pnpm test:db
